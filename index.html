<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davlumbuzz TV - FC Points Özel Teklifi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #050b08;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Arka Planda Hareket Eden Logolar */
        .bg-animations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.3;
            }
            80% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-logo {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            animation: floatUp 10s infinite linear;
        }

        .floating-logo:nth-child(1) { left: 5%; animation-duration: 9s; animation-delay: 0s; }
        .floating-logo:nth-child(2) { left: 20%; animation-duration: 12s; animation-delay: 2s; width: 50px; height: 50px; }
        .floating-logo:nth-child(3) { left: 40%; animation-duration: 8s; animation-delay: 4s; width: 70px; height: 70px; }
        .floating-logo:nth-child(4) { left: 60%; animation-duration: 14s; animation-delay: 1s; }
        .floating-logo:nth-child(5) { left: 75%; animation-duration: 10s; animation-delay: 3s; width: 55px; height: 55px; }
        .floating-logo:nth-child(6) { left: 90%; animation-duration: 11s; animation-delay: 5s; }

        header {
            text-align: center;
            margin-bottom: 25px;
            z-index: 1;
            width: 100%;
            max-width: 450px;
        }

        @keyframes rgbGlow {
            0% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255, 0, 0, 0.5); }
            33% { border-color: #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.8), inset 0 0 10px rgba(0, 255, 102, 0.5); }
            66% { border-color: #0088ff; box-shadow: 0 0 15px rgba(0, 136, 255, 0.8), inset 0 0 10px rgba(0, 136, 255, 0.5); }
            100% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255, 0, 0, 0.5); }
        }

        .hours-banner {
            width: 100%;
            background: rgba(10, 5, 5, 0.9);
            border: 3px solid #ff0000;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            text-align: center;
            animation: rgbGlow 4s infinite linear;
        }

        .hours-text {
            font-size: 13px;
            font-weight: 950;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .countdown-container {
            background: rgba(255, 65, 108, 0.15);
            border: 2px solid #ff416c;
            border-radius: 14px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.3);
            display: inline-block;
        }

        .countdown-title {
            font-size: 12px;
            font-weight: 900;
            color: #ff416c;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .countdown-timer {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .alert-banner {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .card {
            background: rgba(13, 26, 18, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #00ff66;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.25);
            position: relative;
            overflow: hidden;
        }

        .badge {
            position: absolute;
            top: 15px;
            right: -30px;
            background: #00ff66;
            color: #0b140f;
            font-size: 10px;
            font-weight: 900;
            padding: 5px 35px;
            transform: rotate(45deg);
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .points-title {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .price-box {
            background: rgba(0, 255, 102, 0.12);
            border: 1px dashed #00ff66;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 36px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0,255,102,0.4);
        }

        .note {
            font-size: 14px;
            color: #b0c4de;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: background-color 0.2s, transform 0.2s;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
            transform: translateY(-2px);
        }

        .whatsapp-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            z-index: 1;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(13, 26, 18, 0.85);
            border: 2px solid #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: rgba(0, 255, 102, 0.2);
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #00ff66;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0,255,102,0.4);
            z-index: 1;
        }
    </style>
</head>

    </footer>

    <script>
        let countDownTime = localStorage.getItem("davlumbuzz_global_endtime");
        
        if (!countDownTime) {
            countDownTime = new Date().getTime() + (48 * 60 * 60 * 1000); 
            localStorage.setItem("davlumbuzz_global_endtime", countDownTime);
        }

        let x = setInterval(function() {
            let now = new Date().getTime();
            let distance = countDownTime - now;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "SÜRE BİTTİ";
                document.getElementById("main-content").innerHTML = "<div class='card' style='color:#ff416c; font-weight:900; font-size:20px;'>Bu Teklif Sona Ermiştir!</div>";
            } else {
                let hours = Math.floor(distance / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("timer").innerHTML = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }
        }, 1000);
    </script>
