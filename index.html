<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Points Özel Teklifleri</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b140f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .alert-banner {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: linear-gradient(145deg, #112217, #0d1a12);
            border: 2px solid #00ff66;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: -30px;
            background: #00ff66;
            color: #0b140f;
            font-size: 10px;
            font-weight: 900;
            padding: 5px 35px;
            transform: rotate(45deg);
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .points-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .price-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px dashed #00ff66;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 32px;
            font-weight: 900;
            color: #00ff66;
        }

        .note {
            font-size: 13px;
            color: #b0c4de;
            margin-bottom: 15px;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: background-color 0.2s;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        .whatsapp-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #00ff66;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

</body>
</html>
